const LESSONS=[
{title:'Makna dan sifat eksponen',eyebrow:'BAB 01 · 4 JP',intro:'Eksponen mencatat berapa kali suatu faktor dikalikan dengan dirinya sendiri.',formula:'a<sup>n</sup> = a × a × … × a',note:'Untuk n bilangan bulat positif, terdapat n faktor a. Pangkat bukan perkalian basis dengan pangkatnya.',concepts:[
['Kenali basis dan pangkat','Pada 3⁴, bilangan 3 adalah basis dan 4 adalah pangkat. Jadi 3⁴ = 3 × 3 × 3 × 3 = 81.'],
['Satu basis, gabungkan faktor','aᵐ × aⁿ = aᵐ⁺ⁿ. Pada pembagian, aᵐ ÷ aⁿ = aᵐ⁻ⁿ dengan a ≠ 0.'],
['Pangkat dari pangkat','(aᵐ)ⁿ = aᵐⁿ. Pangkat hasil kali: (ab)ⁿ = aⁿbⁿ; pangkat hasil bagi: (a/b)ⁿ = aⁿ/bⁿ dengan b ≠ 0.'],
['Nol dan negatif','a⁰ = 1 dan a⁻ⁿ = 1/aⁿ, keduanya untuk a ≠ 0. Pangkat negatif menyatakan kebalikan, bukan hasil yang negatif.'],
['Basis prima dan notasi ilmiah','64 = 2⁶. Notasi ilmiah menulis bilangan positif sebagai c × 10ⁿ dengan 1 ≤ c < 10, misalnya 3.200.000 = 3,2 × 10⁶.']
],steps:['Diketahui: (2³ × 2⁵) ÷ 2⁴. Ditanyakan: bentuk paling sederhana.','Strategi: semua faktor berbasis 2; gunakan aturan kali dan bagi.','Gabungkan pangkat: 2³⁺⁵⁻⁴ = 2⁴.','Jawaban: 16. Kesimpulan: operasi pada pangkat mengikuti operasi pada faktor.'],pitfall:'(−2)⁴ = 16, sedangkan −2⁴ = −16. Tanda kurung menentukan apakah tanda negatif termasuk basis. 0⁰ tidak didefinisikan dalam modul ini.',check:'Sederhanakan 3² × 3³. Berapa pangkat dari basis 3?',answer:5,explain:'Basis sama: pangkat dijumlahkan, sehingga 3² × 3³ = 3⁵.',visual:'fold'},
{title:'Pangkat rasional dan bentuk akar',eyebrow:'BAB 02 · 4 JP',intro:'Akar mengembalikan operasi pangkat. Panjang sisi sebuah persegi dapat ditemukan dari luasnya.',formula:'a<sup>m/n</sup> = ⁿ√(a<sup>m</sup>)',note:'Dalam aturan pangkat rasional umum di sini gunakan a > 0, m bilangan bulat, n bilangan bulat positif. Akar pangkat genap bernilai real untuk radikan ≥ 0.',concepts:[
['Akar adalah operasi kebalikan','√a adalah akar kuadrat utama, sehingga nilainya tidak negatif. √25 = 5, tetapi persamaan x² = 25 mempunyai solusi x = ±5. Untuk akar ganjil, ∛(−8) = −2.'],
['Sederhanakan dengan kuadrat sempurna','√72 = √(36 × 2) = 6√2. Secara umum √(ab) = √a √b untuk a, b ≥ 0.'],
['Gabungkan akar sejenis','3√2 + 5√2 = 8√2. Akar yang berbeda tidak langsung dijumlahkan: √2 + √3 tetap demikian. √(a + b) biasanya tidak sama dengan √a + √b.'],
['Rasionalkan penyebut','1/√3 = √3/3. Untuk penyebut jumlah atau selisih akar, kalikan dengan sekawannya; contoh 1/(√3 + 1) = (√3 − 1)/2.'],
['Pangkat pecahan','27²ᐟ³ = (∛27)² = 3² = 9. Ingat bahwa √(x²) = |x| untuk x real, sehingga √((−4)²) = 4.']
],steps:['Diketahui: luas bidang persegi 72 m². Ditanyakan: panjang sisi eksak.','Strategi: sisi s = √L = √72; keluarkan faktor kuadrat sempurna.','72 = 36 × 2, sehingga √72 = √36 × √2.','Jawaban: s = 6√2 m ≈ 8,485 m. Kesimpulan: bentuk akar mempertahankan nilai eksak.'],pitfall:'√9 + √16 = 7, sedangkan √(9 + 16) = 5. Akar tidak dapat didistribusikan terhadap penjumlahan.',check:'Berapa koefisien √3 dalam bentuk sederhana √75?',answer:5,explain:'√75 = √(25 × 3) = 5√3; koefisiennya 5.',visual:'root'},
{title:'Fungsi eksponen',eyebrow:'BAB 03 · 4 JP',intro:'Perubahan eksponensial mempertahankan faktor pengali yang sama pada setiap interval.',formula:'N(t) = N₀ · b<sup>t</sup>',note:'N₀ adalah nilai awal. Basis b > 0 dan b ≠ 1. Untuk model perubahan positif, N₀ > 0.',concepts:[
['Pertumbuhan','Jika b > 1, nilai meningkat. Pertumbuhan 20% tiap interval berarti b = 1 + 0,20 = 1,20, bukan 20.'],
['Peluruhan','Jika 0 < b < 1, nilai menurun. Berkurang 20% berarti tersisa 80%, sehingga b = 0,80.'],
['Baca grafik','Grafik y = bˣ melalui (0,1), selalu positif, dan memiliki asimtot horizontal y = 0. Domainnya semua bilangan real; range-nya bilangan real positif.'],
['Interval harus konsisten','Jika nilai menjadi setengah setiap 3 meter, modelnya I(d) = I₀(1/2)ᵈᐟ³. Pangkat menghitung banyak interval, bukan sekadar jarak.'],
['Uji keterbatasan model','Pertumbuhan tanpa batas jarang berlaku selamanya. Ketersediaan ruang dan nutrisi dapat mengubah faktor pertumbuhan organisme. Data ilustrasi perlu dibedakan dari pengukuran nyata.']
],steps:['Diketahui: intensitas awal 100%, tersisa setengah tiap kedalaman 3 m. Ditanyakan: intensitas pada 6 m.','Strategi: hitung banyak interval kedalaman, yaitu 6 ÷ 3 = 2.','I(6) = 100 × (1/2)² = 100 × 1/4.','Jawaban: 25%. Kesimpulan: peluruhan dihitung secara perkalian berulang, bukan dikurangi 50 poin setiap interval.'],pitfall:'Faktor pengali berbeda dari selisih tetap. Barisan 2, 4, 6, 8 bertambah secara linear; 2, 4, 8, 16 tumbuh secara eksponensial.',check:'Populasi awal 50 berlipat dua setiap hari. Berapa populasi setelah 3 hari?',answer:400,explain:'N(3) = 50 × 2³ = 50 × 8 = 400.',visual:'graph'},
{title:'Persamaan eksponen',eyebrow:'BAB 04 · 4 JP',intro:'Persamaan eksponen membantu menemukan waktu atau nilai variabel saat dua kuantitas sama.',formula:'a<sup>f(x)</sup> = a<sup>g(x)</sup> ⇒ f(x) = g(x)',note:'Penyamaan pangkat berlaku untuk basis yang sama dengan a > 0 dan a ≠ 1.',concepts:[
['Samakan basis','Ubah kedua ruas ke basis yang sama. Contoh 2ˣ = 32 menjadi 2ˣ = 2⁵, sehingga x = 5.'],
['Gunakan aljabar','4ˣ⁻¹ = 8 menjadi 2²ˣ⁻² = 2³. Maka 2x − 2 = 3 dan x = 5/2.'],
['Substitusi jika diperlukan','Untuk 4ˣ − 5·2ˣ + 4 = 0, misalkan u = 2ˣ > 0. Persamaan berubah menjadi u² − 5u + 4 = 0, sehingga u = 1 atau u = 4; hasilnya x = 0 atau x = 2.'],
['Periksa hasil dalam konteks','Substitusikan solusi ke persamaan awal. Waktu dapat dibatasi t ≥ 0 atau hanya bilangan bulat sesuai situasi.']
],steps:['Diketahui: 3²ˣ⁻¹ = 27. Ditanyakan: nilai x.','Strategi: ubah 27 menjadi 3³. Basis 3 memenuhi syarat.','Samakan pangkat: 2x − 1 = 3 → 2x = 4.','Jawaban: x = 2. Cek: 3²⁽²⁾⁻¹ = 3³ = 27. Kesimpulan: solusi memenuhi persamaan awal.'],pitfall:'Jangan menyamakan pangkat ketika basis berbeda tanpa mengubah bentuknya. Basis 1 tidak memberi solusi tunggal karena 1ˣ = 1 untuk setiap x real.',check:'Tentukan x jika 2ˣ⁺¹ = 32.',answer:4,explain:'32 = 2⁵, sehingga x + 1 = 5 dan x = 4.',visual:'equation'},
{title:'Pertidaksamaan eksponen',eyebrow:'BAB 05 · 4 JP',intro:'Tidak semua masalah menuntut nilai yang tepat sama. Kadang kita membutuhkan batas aman atau syarat minimum.',formula:'b > 1: bˣ ≥ bʸ ⇔ x ≥ y',note:'Untuk 0 < b < 1, fungsi menurun sehingga arah pertidaksamaan pangkat berbalik: bˣ ≥ bʸ ⇔ x ≤ y.',concepts:[
['Basis lebih dari satu','2ˣ ≥ 16 berarti 2ˣ ≥ 2⁴, jadi x ≥ 4. Nilai fungsi dan pangkat berubah searah.'],
['Basis antara nol dan satu','(1/2)ˣ ≥ 1/8 berarti (1/2)ˣ ≥ (1/2)³, jadi x ≤ 3. Fungsi menurun: pangkat lebih besar menghasilkan nilai lebih kecil.'],
['Terapkan syarat konteks','Bila cahaya minimum 12,5% dan I(d) = 100(1/2)ᵈᐟ³, maka d ≤ 9 m. Jika kedalaman minimum penempatan 4 m, irisan syaratnya 4 ≤ d ≤ 9.'],
['Tentukan batas inklusif','Simbol ≥ dan ≤ memasukkan titik batas. Simbol > dan < tidak memasukkan batas. Untuk hari utuh, pilih bilangan bulat yang memenuhi.']
],steps:['Diketahui: (1/3)²ˣ⁻¹ > 1/27. Ditanyakan: himpunan solusi real.','Strategi: tulis 1/27 = (1/3)³; basis 1/3 berada antara nol dan satu.','Balik arah saat membandingkan pangkat: 2x − 1 < 3 → 2x < 4.','Jawaban: x < 2. Kesimpulan: x = 2 tidak termasuk karena pertidaksamaannya ketat.'],pitfall:'Ada dua alasan berbeda untuk membalik arah: membandingkan pangkat pada basis 0 < b < 1, atau mengalikan/membagi pertidaksamaan dengan bilangan negatif.',check:'Untuk (1/2)ˣ ≥ 1/16, berapa batas atas x?',answer:4,explain:'1/16 = (1/2)⁴. Karena basis menurun, x ≤ 4.',visual:'inequality'}
];

{id:'p1',type:'single',chapter:0,title:'Basis yang sama',question:'Hasil 2³ × 2⁴ adalah …',options:['2¹²','2⁷','4⁷','2¹'],answer:[1],hints:['Hitung jumlah faktor 2.','Perkalian dengan basis sama menjumlahkan pangkat.','2² × 2³ = 2⁵; terapkan pada 3 dan 4.'],explain:'2³ × 2⁴ = 2³⁺⁴ = 2⁷ = 128.'},

{id:'p4',type:'number',chapter:1,title:'Bentuk akar sederhana',question:'√108 = k√3. Tentukan nilai k.',answer:6,hints:['Cari kuadrat sempurna yang membagi 108.','108 = 36 × 3.','√36 = 6; faktor √3 tetap di dalam bentuk akar.'],explain:'√108 = √(36 × 3) = 6√3, sehingga k = 6.'},
{id:'p5',type:'text',chapter:2,title:'Kenali perubahan',question:'Suatu zat tersisa 80% setiap jam. Model ini menunjukkan pertumbuhan atau peluruhan?',answer:'peluruhan',hints:['Bandingkan faktor pengali dengan 1.','80% = 0,8, sehingga nilai berikutnya lebih kecil.','Model dengan faktor di antara 0 dan 1 disebut peluruhan.'],explain:'Peluruhan, karena faktor 0,8 berada di antara nol dan satu.'},
{id:'p6',type:'sort',chapter:3,title:'Urutkan strategi',question:'Urutkan penyelesaian 3²ˣ⁻¹ = 27 dari awal hingga akhir.',items:['Tulis 27 = 3³','Samakan pangkat: 2x − 1 = 3','Peroleh 2x = 4','Simpulkan x = 2 dan periksa'],answer:[0,1,2,3],hints:['Mulai dengan mengubah ruas kanan ke basis 3.','Sesudah basis sama, bentuk persamaan pada pangkat.','Urutan: ubah basis → samakan pangkat → aljabar → periksa.'],explain:'27 = 3³ → 2x − 1 = 3 → 2x = 4 → x = 2. Cek menghasilkan 3³ = 27.'},

{id:'p8',type:'number',chapter:4,title:'HOTS · Zona cahaya laut',question:'Data ilustrasi: I(d) = 100 × (1/2)ᵈᐟ³ persen. Terumbu memerlukan cahaya ≥ 12,5% dan kedalaman ≥ 4 m. Berapa kedalaman maksimum zona yang memenuhi kedua syarat, dalam meter?',answer:9,hints:['Bagi syarat intensitas dengan 100.','12,5/100 = 1/8 = (1/2)³. Bandingkan pangkat dengan arah berbalik.','d/3 ≤ 3 sehingga d ≤ 9. Irisankan dengan d ≥ 4.'],explain:'Diketahui I(d) ≥ 12,5 dan d ≥ 4. Strategi: samakan basis. (1/2)ᵈᐟ³ ≥ (1/2)³ → d/3 ≤ 3 → d ≤ 9. Jadi zona 4 ≤ d ≤ 9 m, dengan kedalaman maksimum 9 m.'}

patan</span></div></div></div></div><div class="eyebrow">PETA PERJALANAN BELAJAR</div><div class="coverpaths">${MODULE_CONFIG.submateri.map((x,i)=>`<div class="path"><div class="number">0${i+1}</div><b>${esc(x)}</b><span>Konsep · Eksplorasi · Aplikasi</span></div>`).join('')}</div></main><footer class="coverfoot"><span>Pengembang: ${esc(MODULE_CONFIG.namaPengembang)}</span><span>${esc(MODULE_CONFIG.instansi)} · ${MODULE_CONFIG.tahun}</span></footer></div>`}
function shell(content){const active=navs.find(x=>x[0]===route);return `<aside class="sidebar" id="sidebar">${brand()}<div class="navlabel">RUANG BELAJAR</div><nav class="nav" aria-label="Menu utama">${navs.map(([id,ic,t])=>`<button data-nav="${id}" class="${route===id?'active':''}" ${route===id?'aria-current="page"':''}>${ico(ic)}<span>${t}</span><span class="check" aria-hidden="true"></span></button>`).join('')}</nav><div class="sidebarbottom"><div class="card"><div class="row between"><b class="smalltext">Progres belajarmu</b><b class="smalltext" data-progress>${percent()}%</b></div><div class="progress"><span data-progress-bar style="width:${percent()}%"></span></div><p>Langkah kecil, pemahaman besar.</p></div><button class="ghost small" data-action="teacher" style="margin-top:12px;width:100%;text-align:left">${ico('settings')} Mode Guru</button></div></aside><button class="scrim" data-action="menu" aria-label="Tutup menu"></button><div class="shell"><header class="topbar"><div class="row"><button class="ghost mobilemenu" data-action="menu" aria-label="Buka menu utama">${ico('menu')}</button><span class="bread">Ruang Belajar <span aria-hidden="true">/</span> <b>${active?.[2]||'Kelas'}</b></span></div><div class="tools">${toolsBar()}<span class="tag profile">${esc(state.name||'Siswa')}</span></div></header><main class="main" id="main">${content}</main><footer class="appfoot"><span>Pengembang: ${esc(MODULE_CONFIG.namaPengembang)} · ${esc(MODULE_CONFIG.instansi)}</span><span>Matematika · Fase E · ${MODULE_CONFIG.tahun}</span></footer></div>`}

function curveSVG(initial,rate,steps,mark=steps,cover=false){const vals=Array.from({length:steps+1},(_,i)=>initial*rate**i),max=Math.max(...vals)*1.12,w=480,h=240,x=i=>70+i/steps*384,y=v=>200-v/max*166;const ticks=[0,.25,.5,.75,1];return `<svg viewBox="0 0 ${w} ${h}" class="chart" role="img" aria-label="Grafik nilai eksponensial terhadap langkah. Nilai akhir ${fmt(vals[steps])}.">${ticks.map(t=>`<line x1="70" y1="${y(t*max)}" x2="454" y2="${y(t*max)}" stroke="${cover?'#31506b':'var(--border)'}"/><text x="62" y="${y(t*max)+4}" text-anchor="end" style="fill:${cover?'#adc4db':'var(--muted)'}">${axisFmt(t*max)}</text>`).join('')}<polyline points="${vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${cover?'#9ce7d8':'var(--teal)'}" stroke-width="3.5"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===mark?7:3}" fill="${i===mark?'#ecb751':cover?'#9ce7d8':'var(--teal)'}"/><text x="${x(i)}" y="220" text-anchor="middle" style="fill:${cover?'#adc4db':'var(--muted)'}">${i}</text>`).join('')}<text x="450" y="237" text-anchor="end" style="fill:${cover?'#adc4db':'var(--muted)'}">Langkah / waktu</text></svg>`}
function home(){const completed=[0,1,2,3,4].filter(i=>state.done.includes('c'+i)).length;return `${head('SELAMAT DATANG',`Siap menemukan pola${state.name?', '+esc(state.name):''}?`,'Ruang untuk mencoba, bertanya, dan memahami. Satu konsep dalam satu waktu.')}<section class="card welcome"><div><div class="eyebrow">BELAJAR DARI SEKITAR KITA</div><h2>Matematika tumbuh<br>dari rasa ingin tahu.</h2><p>Eksplorasi pangkat dan akar melalui lipatan kertas, cahaya di laut, dan rancangan di lingkungan Belitung Timur.</p><button class="primary" data-action="continue">${percent()?'Lanjutkan Pembelajaran':'Mulai perjalanan'} ${ico('arrow')}</button></div><div class="mini-math"><span class="smalltext">DARI POLA MENJADI MODEL</span><div class="formula">2⁰ → 2¹ → 2² → 2³</div><p class="smalltext" style="margin:10px 0 0">1 &nbsp; → &nbsp; 2 &nbsp; → &nbsp; 4 &nbsp; → &nbsp; 8</p></div></section><div class="grid three" style="margin-top:22px"><div class="card compact stat"><span class="iconbox">${ico('book')}</span><div><b>${completed}<span class="muted" style="font-size:1rem"> / 5</span></b><small>Bab dipelajari</small></div></div><div class="card compact stat"><span class="iconbox">${ico('bolt')}</span><div><b data-xp>${fmt(xp())}</b><small>XP terkumpul</small></div></div><div class="card compact stat"><span class="iconbox">${ico('trophy')}</span><div><b>${state.result?state.result.score:'—'}</b><small>Nilai evaluasi terakhir</small></div></div></div><div class="grid" style="grid-template-columns:1.55fr 1fr;margin-top:26px" id="home-lower"><section><div class="sectiontitle" style="margin-top:0"><h2>Perjalanan belajarmu</h2><span class="tag">${esc(MODULE_CONFIG.alokasiWaktu)}</span></div><div class="card">${MODULE_CONFIG.submateri.map((t,i)=>`<div class="lessonrow"><span class="lessonnum">${state.done.includes('c'+i)?'✓':'0'+(i+1)}</span><div><h3>${esc(t)}</h3><p>${['Makna pangkat & tujuh sifat dasar','Dari pangkat pecahan ke panjang sisi','Pertumbuhan, peluruhan & grafik','Menemukan nilai yang belum diketahui','Membandingkan dan menentukan batas'][i]}</p></div><button class="small" data-chapter="${i}">${state.done.includes('c'+i)?'Ulangi':'Pelajari'} →</button></div>`).join('')}</div></section><aside class="stack"><div class="card"><div class="eyebrow">PROFIL BELAJAR</div><label for="student-name">Nama siswa</label><input id="student-name" maxlength="70" autocomplete="given-name" placeholder="Tulis namamu" value="${esc(state.name)}"><div class="field" style="margin-top:16px"><label for="learning-level">Jalur belajar</label><select id="learning-level"><option value="bantuan" ${state.level==='bantuan'?'selected':''}>Butuh bantuan · lebih banyak petunjuk</option><option value="reguler" ${state.level==='reguler'?'selected':''}>Reguler · konsep dan penerapan</option><option value="tantangan" ${state.level==='tantangan'?'selected':''}>Tantangan · analisis dan HOTS</option></select></div><p class="helptext">Tersimpan otomatis pada perangkat ini.</p></div><div class="card tint"><span class="iconbox">${ico('flask')}</span><h3>Coba laboratorium mini</h3><p class="smalltext">Apa yang terjadi ketika faktor pertumbuhan diganti menjadi kurang dari satu?</p><button data-nav="simulasi">Uji model eksponen →</button></div><div class="card"><h3>Pencapaian</h3><div class="row">${badges()}</div><p class="helptext">Rekor jawaban beruntun: ${state.bestStreak}</p></div></aside></div><style>@media(max-width:1100px){#home-lower{grid-template-columns:1fr!important}}</style>`}
function badges(){const b=[];if([0,1,2,3,4].every(i=>state.done.includes('c'+i)))b.push('🏅 Penjelajah Konsep');if(state.done.includes('latihan'))b.push('🏅 Master Latihan');if(state.result?.score===100)b.push('🏆 Perfect Score');if(percent()===100)b.push('🎓 Modul Selesai');return b.length?b.map(s=>`<span class="badge">${s}</span>`).join(''):'<span class="muted smalltext">Selesaikan kegiatan untuk membuka badge pertamamu.</span>'}
function goals(){return `${head('ARAH BELAJAR','Apa yang akan kamu kuasai?','Setelah mengikuti rangkaian ini, kamu diharapkan mampu mencapai tujuan berikut.')}<div class="grid">${SOURCE.objectives.map((o,i)=>`<article class="card goal"><span class="iconbox">${ico(['explore','book','bolt','target','pen','flask','chart','search','check','trophy'][i])}</span><div><span class="eyebrow">TUJUAN ${String(i+1).padStart(2,'0')}</span><p>${esc(o.text)}</p></div></article>`).join('')}</div><div class="card" style="margin-top:22px"><h3>Bekal awal</h3><p>Operasi bilangan bulat, faktorisasi prima, pecahan, akar kuadrat, persen, perbandingan, serta tabel dan koordinat.</p><div class="row"><span class="tag">Science · amati fenomena</span><span class="tag">Technology · olah data</span><span class="tag">Engineering · uji rancangan</span><span class="tag">Mathematics · bangun model</span></div></div><div class="quizfoot"><button data-nav="home">← Beranda</button><button class="primary" data-action="goals-done">Saya memahami tujuan →</button></div>`}

function aperception(){const qs=['Satu lembar kertas dilipat menjadi dua berulang kali. Apakah jumlah lapisannya bertambah tetap atau berlipat tetap?','Mengapa cahaya semakin redup ketika kedalaman laut bertambah?','Jika luas persegi diketahui, bagaimana menemukan panjang sisinya?'];return `${head('SEBELUM KITA MULAI','Hal kecil, pertanyaan besar.','Hubungkan pengalamanmu dengan konsep baru. Jawaban awal ini tidak diberi skor.')}<div class="grid"><div class="stack">${qs.map((q,i)=>`<section class="card"><span class="tag">PEMANTIK 0${i+1}</span><h3 style="margin-top:18px">${q}</h3><div class="row">${['💡 Saya sudah tahu','🤔 Saya sedikit tahu','❓ Saya belum tahu'].map((x,j)=>`<button class="small ${state.intro[i]===j?'primary':''}" data-warm="${i}" data-value="${j}" aria-pressed="${state.intro[i]===j}">${x}</button>`).join('')}</div></section>`).join('')}</div><section class="card"><div class="eyebrow">AMATI · DUGA · JELASKAN</div><h2>Dari satu menjadi banyak</h2><p>Setiap lipatan ideal menggandakan lapisan. Bayangkan kertas yang cukup tipis dan luas; model ini tidak memperhitungkan keterbatasan melipat kertas nyata.</p><div class="formula center">1 → 2 → 4 → 8 → …</div><button data-action="warm-step">${warmStep?'Pertanyaan berikutnya':'Apa yang kamu perhatikan?'} ${ico('arrow')}</button><div>${['Setelah 5 lipatan, berapa lapisan yang kamu duga? Jelaskan cara berpikirmu.','Jika satu lapisan setebal 0,1 mm, berapa tebal ideal setelah 5 lipatan?','Pola ideal memberi 2⁵ = 32 lapisan, dengan tebal 32 × 0,1 = 3,2 mm. Apa keterbatasan model ini?'].slice(0,warmStep).map((x,i)=>`<div class="step"><b>Langkah ${i+1}</b><p style="margin:6px 0 0">${x}</p></div>`).join('')}</div><label for="warm-observation" style="margin-top:22px">Catatan pengamatanmu</label><textarea id="warm-observation" rows="4" maxlength="2000" placeholder="Saya memperhatikan bahwa…">${esc(state.intro.note||'')}</textarea><div class="helptext">Catatan tersimpan otomatis.</div></section></div><div class="quizfoot"><button data-nav="tujuan">← Tujuan</button><button class="primary" data-action="warm-done">Simpan & masuk materi →</button></div>`}
function material(){const c=LESSONS[chapter];return `${head(c.eyebrow,c.title,c.intro)}<div class="tabs" aria-label="Pilih bab">${LESSONS.map((a,i)=>`<button class="${i===chapter?'active':''}" data-chapter="${i}" aria-pressed="${i===chapter}">${i+1}. ${esc(MODULE_CONFIG.submateri[i])} ${state.done.includes('c'+i)?'✓':''}</button>`).join('')}</div><div class="grid"><section class="stack"><div class="card"><div class="eyebrow">INTI KONSEP</div><div class="formula">${c.formula}</div><p class="callout">${c.note}</p>${c.concepts.map((a,i)=>`<details ${i===0?'open':''}><summary>${a[0]}</summary><p>${a[1]}</p></details>`).join('')}</div><div class="card"><h3>Waspadai kekeliruan ini</h3><p style="margin:0">${c.pitfall}</p></div></section><section class="stack"><div class="card"><div class="row between"><div class="eyebrow" style="margin:0">CONTOH TERBIMBING</div><button class="small" data-action="step-toggle">${stepMode?'Tampilkan semua':'▶ Pelajari Bertahap'}</button></div><h3 style="margin-top:20px">Dari informasi ke kesimpulan</h3>${c.steps.slice(0,stepMode?stepIndex+1:4).map((s,i)=>`<div class="step"><span class="tag">0${i+1}</span><p style="margin:8px 0 0">${s}</p></div>`).join('')}${stepMode?`<div class="quizfoot"><button data-step="-1" ${stepIndex===0?'disabled':''}>← Kembali</button><span class="smalltext">${stepIndex+1} / 4</span><button data-step="1" ${stepIndex===3?'disabled':''}>Selanjutnya →</button></div>`:''}</div><div class="card tint"><span class="iconbox">${ico('explore')}</span><h3>${['Lihat lapisan bertambah','Ubah luas, amati sisi','Ubah faktor pengali','Cari pertemuan dua kolam','Tentukan zona cahaya'][chapter]}</h3><p class="smalltext">${['Geser banyak lipatan dan perhatikan makna 2ⁿ.','Panjang sisi berubah sesuai akar dari luas.','Grafik langsung mengikuti parameter modelmu.','Uji persamaan A(t) = B(t) pada data ilustrasi mikroalga.','Gabungkan syarat kedalaman dengan batas minimum cahaya.'][chapter]}</p><button data-action="lesson-visual">Buka eksplorasi ${ico('arrow')}</button></div><div class="card"><h3>Coba sendiri</h3><label for="concept-answer">${c.check}</label><input id="concept-answer" inputmode="decimal" autocomplete="off" placeholder="Ketik jawaban angka"><button class="primary" data-action="concept-check" style="margin-top:12px">Periksa jawaban</button><div id="concept-feedback" aria-live="polite"></div></div>${state.level==='bantuan'?`<div class="card"><h3>Butuh bantuan?</h3><p>${['Tuliskan semua faktor. Contoh 2³ = 2 × 2 × 2, lalu hitung satu per satu.','Ingat kuadrat sempurna: 1, 4, 9, 16, 25, 36, 49, 64, 81.','Mulailah dengan tabel t = 0, 1, 2. Kalikan nilai sebelumnya dengan faktor b.','Buat daftar pangkat basis yang sama sebelum memanipulasi variabel.','Uji dua pangkat sederhana: (1/2)¹ = 0,5 dan (1/2)² = 0,25. Pangkat naik, hasil turun.'][chapter]}</p></div>`:''}${state.level==='tantangan'?`<div class="card"><h3>Tantangan penalaran</h3><p>${['Mengapa pangkat tidak dapat didistribusikan terhadap penjumlahan? Buat contoh penyangkal.','Buktikan √((x + 1)²) = |x + 1|. Uji x = −3.','Mengapa prediksi pertumbuhan mikroalga tidak dapat diterapkan tanpa batas?','Selesaikan 4ˣ − 5·2ˣ + 4 = 0 melalui substitusi u = 2ˣ.','Bagaimana zona terumbu berubah jika kedalaman pemaruhan turun dari 3 m ke 2 m?'][chapter]}</p><button data-nav="simulasi">Uji dan jelaskan →</button></div>`:''}</section></div><div class="quizfoot materialnav"><button data-chapter="${Math.max(0,chapter-1)}" ${chapter===0?'disabled':''}>← Bab sebelumnya</button><button class="primary" data-action="chapter-done">${state.done.includes('c'+chapter)?'Bab sudah dipelajari ✓ · Lanjut':'Tandai sudah dipahami & lanjut →'}</button></div>`}
function matchPairs(kind){return kind==='practice'?PRACTICE[6].pairs:kind==='game'?[['2³','8'],['√36','6'],['4⁰','1'],['8¹ᐟ³','2']]:[['aᵐ × aⁿ','aᵐ⁺ⁿ'],['(aᵐ)ⁿ','aᵐⁿ'],['a⁻ⁿ','1/aⁿ'],['a⁰','1']]}
function matchUI(kind){const pairs=matchPairs(kind);if(!matchState[kind])matchState[kind]={placed:{},order:shuffle(pairs.map((_,i)=>i)),errors:0};const s=matchState[kind];return `<p class="helptext">Tarik kartu ke pasangan yang tepat. Alternatif sentuh/keyboard: pilih kartu, lalu pilih tujuan.${kind==='explore'?' Gunakan a > 0 agar semua bentuk terdefinisi.':''}</p><div class="matchgrid" data-match-group="${kind}"><div class="matchitems">${pairs.map(([l],i)=>`<button class="matchitem ${selectedMatch?.kind===kind&&selectedMatch?.index===i?'selected':''}" data-match-item="${i}" data-kind="${kind}" ${Object.values(s.placed).includes(i)?'disabled':''} aria-pressed="${selectedMatch?.kind===kind&&selectedMatch?.index===i}">${esc(l)}</button>`).join('')}</div><div class="matchtargets">${s.order.map(i=>`<button class="matchtarget ${s.placed[i]!==undefined?'matched':''}" data-match-target="${i}" data-kind="${kind}" ${s.placed[i]!==undefined?'disabled':''}>${s.placed[i]!==undefined?'✓ '+esc(pairs[s.placed[i]][0])+' = ':''}${esc(pairs[i][1])}</button>`).join('')}</div></div><div id="match-feedback-${kind}" aria-live="polite">${Object.keys(s.placed).length===pairs.length?'<div class="feedback good">✓ Semua pasangan tepat. Kamu memahami hubungan bentuk dan nilainya.</div>':''}</div><button class="small" data-match-reset="${kind}" style="margin-top:16px">↻ Ulangi pasangan</button>`}
function explore(){return `${head('COBA · AMATI · TEMUKAN','Eksplorasi konsep','Gerakkan parameter atau pasangkan kartu. Temukan sendiri hubungan antarnilai.')}<div class="tabs">${[['fold','Lipatan kertas'],['root','Luas & akar'],['match','Pasangkan sifat']].map(([id,t])=>`<button data-explore="${id}" class="${exploreTab===id?'active':''}">${t}</button>`).join('')}</div>${exploreTab==='fold'?`<div class="grid"><section class="card"><div class="eyebrow">MANIPULATIF 01</div><h2>Dua kali lipat</h2><label for="fold-range">Banyak lipatan: <span id="fold-n">3</span></label><input id="fold-range" type="range" min="0" max="6" value="3"><div class="formula center" id="fold-equation">2³ = 8 lapisan</div><p>Satu lipatan mengalikan jumlah lapisan dengan 2. Pangkat menyatakan banyaknya penggandaan sejak kondisi awal.</p><div class="callout">Model ideal: setiap lipatan membagi kertas menjadi dua bagian sama besar, tanpa batas fisik ketebalan.</div><button data-action="fold-done" class="primary" style="margin-top:20px">Saya menemukan polanya ✓</button></section><section class="card"><h3>Jumlah lapisan</h3><div class="sheetvisual" id="fold-visual">${'<span></span>'.repeat(8)}</div><p id="fold-description" class="muted">8 lapisan setelah 3 lipatan.</p><div id="fold-chart">${curveSVG(1,2,6,3)}</div></section></div>`:exploreTab==='root'?`<div class="grid"><section class="card"><div class="eyebrow">MANIPULATIF 02</div><h2>Dari luas ke panjang sisi</h2><label for="area-range">Luas persegi: <span id="area-value">36</span> m²</label><input id="area-range" type="range" min="1" max="100" value="36"><div class="formula center" id="area-equation">s = √36 = 6 m</div><p>Untuk setiap luas positif, ada satu panjang sisi positif. Luas bertambah empat kali saat sisi bertambah dua kali.</p><button class="primary" data-action="root-done">Saya memahami hubungan akar ✓</button></section><section class="card"><h3>Persegi dengan luas yang kamu pilih</h3><svg viewBox="0 0 360 300" class="chart" role="img" aria-label="Persegi dengan ukuran sisi berubah mengikuti akar luas"><rect id="area-square" x="114" y="84" width="132" height="132" rx="4" fill="var(--mint)" stroke="var(--teal)" stroke-width="2"/><text id="area-label" x="180" y="157" text-anchor="middle" style="font-size:20px;fill:var(--teal)">36 m²</text><text id="side-label" x="180" y="270" text-anchor="middle">Sisi = 6 m</text></svg><div class="callout">Coba luas 2, 8, 18, dan 72. Nilai sisi yang ditampilkan dibulatkan; bentuk akar memberikan nilai eksak.</div></section></div>`:`<section class="card" style="max-width:900px"><h2>Sifat mana yang sesuai?</h2>${matchUI('explore')}</section>`}`}
function simulation(){return `${head('LABORATORIUM MINI','Uji modelmu. Baca perubahannya.','Ubah parameter, bandingkan grafik, lalu jelaskan keputusanmu berdasarkan hasil.')}<div class="tabs"><button class="active" data-sim-tab="model">Model eksponen</button><button data-sim-tab="coral">Zona cahaya laut</button><button data-sim-tab="algae">Dua kolam mikroalga</button><button data-sim-tab="tank">Bak air hujan</button><button data-sim-tab="project">Proyek STEM</button></div><div id="sim-body">${modelSim()}</div>`}
function modelSim(){return `<div class="grid"><section class="card"><div class="row between"><h3>Parameter eksperimen</h3><span class="tag gold">Data ilustrasi</span></div><div class="field"><label for="sim-mode">Jenis perubahan</label><select id="sim-mode"><option value="growth" ${sim.mode==='growth'?'selected':''}>Pertumbuhan</option><option value="decay" ${sim.mode==='decay'?'selected':''}>Peluruhan</option></select></div><div class="field"><label for="sim-initial">Nilai awal N₀ (1–1.000)</label><div class="row" style="flex-wrap:nowrap"><button data-sim-initial="-10" aria-label="Kurangi nilai awal">−</button><input id="sim-initial" type="number" min="1" max="1000" value="${sim.initial}"><button data-sim-initial="10" aria-label="Tambah nilai awal">+</button></div></div><label for="sim-rate">Faktor pengali b: <span id="sim-rate-value">${fmt(sim.rate)}</span></label><input id="sim-rate" type="range" min="${sim.mode==='growth'?1.1:.1}" max="${sim.mode==='growth'?3:.9}" step="0.1" value="${sim.rate}"><label for="sim-steps">Banyak interval: <span id="sim-steps-value">${sim.steps}</span></label><input id="sim-steps" type="range" min="1" max="10" step="1" value="${sim.steps}"><div class="row"><button class="primary" data-action="sim-run">▶ Jalankan</button><button data-action="sim-reset">↻ Reset</button><button data-action="sim-hint">💡 Petunjuk</button></div><div id="sim-hint" class="helptext">N(t) = N₀ × bᵗ. Setiap satu interval, nilai dikalikan dengan b.</div></section><section class="card"><div class="row between"><h3>Nilai model</h3><span class="tag" id="sim-type">Pertumbuhan</span></div><div class="metric" id="sim-result"></div><div class="smalltext muted" id="sim-eq"></div><div class="plotbox" id="sim-chart"></div><table class="data-table"><thead><tr><th>Interval</th><th>Nilai model</th><th>Faktor</th></tr></thead><tbody id="sim-table"></tbody></table></section></div><div class="card" style="margin-top:22px"><label for="sim-note">Kesimpulan eksperimen</label><textarea id="sim-note" rows="3" maxlength="2500" placeholder="Ketika faktor pengali saya ubah, grafik…">${esc(state.project.simNote||'')}</textarea><button class="primary" data-action="sim-done" style="margin-top:12px">Simpan kesimpulan eksperimen</button></div>`}
function updateSim(mark){if(!$('#sim-chart'))return;const v=sim.initial*sim.rate**sim.steps;$('#sim-result').textContent=fmt(mark!==undefined?sim.initial*sim.rate**mark:v);$('#sim-rate-value').textContent=fmt(sim.rate);$('#sim-steps-value').textContent=sim.steps;$('#sim-type').textContent=sim.mode==='growth'?'Pertumbuhan':'Peluruhan';$('#sim-eq').textContent=`N(${mark??sim.steps}) = ${fmt(sim.initial)} × ${fmt(sim.rate)}^${mark??sim.steps}`;$('#sim-chart').innerHTML=curveSVG(sim.initial,sim.rate,sim.steps,mark??sim.steps);$('#sim-table').innerHTML=Array.from({length:sim.steps+1},(_,i)=>`<tr><td>${i}</td><td>${fmt(sim.initial*sim.rate**i)}</td><td>${i?fmt(sim.rate):'Awal'}</td></tr>`).join('')}
function coralSim(){return `<div class="grid"><section class="card"><span class="tag gold">Data ilustrasi · Belitung Timur</span><h2 style="margin-top:20px">Rancang zona terumbu</h2><p>Struktur ditempatkan pada kedalaman minimal 4 m dan memerlukan intensitas cahaya minimal 12,5% dari permukaan.</p><div class="formula">I(d) = 100(½)<sup>d/h</sup></div><label for="coral-half">Kedalaman pemaruhan h: <span id="coral-half-label">3</span> m</label><input id="coral-half" type="range" min="1" max="5" step="1" value="3"><label for="coral-depth">Kedalaman yang diuji d: <span id="coral-depth-label">6</span> m</label><input id="coral-depth" type="range" min="0" max="18" step=".5" value="6"><p class="helptext">h lebih kecil memodelkan cahaya yang lebih cepat melemah. Ini model pembelajaran, bukan rekomendasi penempatan lapangan.</p></section><section class="card"><h3>Hasil pengujian</h3><div class="metric" id="coral-intensity">25%</div><div id="coral-status" class="feedback good">✓ Kedalaman 6 m memenuhi kedua syarat.</div><div class="formula center" id="coral-zone">4 ≤ d ≤ 9 m</div><div class="plotbox" id="coral-chart">${curveSVG(100,.5,6,2)}</div><p class="smalltext muted">Pada grafik, satu interval menunjukkan kedalaman h meter.</p><details><summary>Alasan matematis</summary><p>100(1/2)ᵈᐟʰ ≥ 12,5 → (1/2)ᵈᐟʰ ≥ (1/2)³. Basis menurun, jadi d/h ≤ 3 dan d ≤ 3h. Irisankan dengan d ≥ 4.</p></details></section></div>`}
function algaeSim(){return `<div class="grid"><section class="card"><span class="tag gold">Data ilustrasi · Mikroalga</span><h2 style="margin-top:20px">Kapan kedua kolam sama?</h2><div class="formula">A(t) = 10⁶ · 2<sup>t</sup><br>B(t) = 64 · 10⁶ · 2<sup>t/3</sup></div><p>Kolam A berawal lebih kecil tetapi berlipat dua setiap hari. Kolam B berlipat dua setiap tiga hari.</p><label for="algae-time">Waktu: <span id="algae-day">3</span> hari</label><input id="algae-time" type="range" min="0" max="12" step="1" value="3"><div class="callout">Bandingkan kepadatan pada hari ke-0, 6, 9, dan 12. Untuk target ≥ 500 juta sel/mL, tentukan hari utuh pertama setiap kolam mencapai target.</div></section><section class="card"><h3>Kepadatan (juta sel/mL)</h3><div class="grid"><div><span class="tag">Kolam A</span><div class="metric" id="algae-a">8</div></div><div><span class="tag">Kolam B</span><div class="metric" id="algae-b">128</div></div></div><div id="algae-status" class="feedback">Kolam B lebih padat.</div><details><summary>Lihat penyelesaian</summary><p>2ᵗ = 64·2ᵗᐟ³ → t = 6 + t/3 → t = 9. Saat itu A = B = 512 juta sel/mL. Pada t = 8, A = 256 dan B ≈ 406,375; jadi keduanya pertama mencapai 500 juta pada hari utuh ke-9.</p></details><p class="helptext">Model mengasumsikan faktor pertumbuhan tetap dan tidak memperhitungkan keterbatasan nutrisi.</p></section></div>`}
function tankSim(){return `<div class="grid"><section class="card"><span class="tag gold">Proyek terpadu · Data ilustrasi</span><h2 style="margin-top:18px">Bak penampung air hujan</h2><p>Rancang bak beralas persegi yang menampung sedikitnya 4 m³ air. Lahan membatasi panjang sisi alas hingga 2 m dan tinggi bak hingga 1,2 m.</p><div class="formula center">V = s²t &nbsp; → &nbsp; s<sub>min</sub> = √(4/t)</div><label for="tank-height">Tinggi rancangan: <span id="tank-h">1</span> m</label><input id="tank-height" type="range" min=".5" max="1.5" step=".1" value="1"><div class="metric" id="tank-side">Sisi minimum = 2 m</div><div id="tank-status" class="feedback good">✓ Memenuhi batas tinggi dan lahan.</div><h3 style="margin-top:22px">Alur kerja STEM</h3><ol><li><b>Sains:</b> bahas kebutuhan air dan hujan setempat.</li><li><b>Teknologi:</b> bandingkan tiga nilai tinggi memakai simulator.</li><li><b>Enjinering:</b> pilih rancangan, gambar sketsa, uji semua batasan.</li><li><b>Matematika:</b> gunakan akar untuk menentukan sisi minimum.</li></ol></section><section class="card"><h3>Lembar keputusan kelompok</h3><label for="project-team">Nama kelompok</label><input id="project-team" maxlength="100" value="${esc(state.project.team||'')}" placeholder="Nama kelompokmu"><label for="project-design" style="margin-top:18px">Rancangan dan hasil uji</label><textarea id="project-design" rows="5" maxlength="4000" placeholder="Bandingkan tinggi 0,8 m; 1 m; 1,2 m. Catat sisi minimum dan keputusan untuk tiap rancangan.">${esc(state.project.design||'')}</textarea><label for="project-reason" style="margin-top:18px">Alasan, keterbatasan, dan perbaikan</label><textarea id="project-reason" rows="4" maxlength="4000" placeholder="Mengapa rancangan dipilih? Asumsi apa yang perlu diuji?">${esc(state.project.reason||'')}</textarea><button class="primary" data-action="project-save" style="margin-top:16px">Simpan proyek</button><div class="notice">Penilaian proyek dilakukan guru. Fokus: ketepatan perhitungan, pemenuhan batasan, pengujian alternatif, dan kejelasan alasan.</div></section></div>`}
function practice(){const q=PRACTICE[practiceIndex],s=state.practice[q.id]||{},a=state.answers[q.id];let body='';if(['single','multi','boolean'].includes(q.type))body=`<div class="options">${q.options.map((o,i)=>`<label class="option ${(a||[]).includes(i)?'selected':''}"><input type="${q.type==='multi'?'checkbox':'radio'}" name="practice-answer" value="${i}" ${(a||[]).includes(i)?'checked':''} ${s.correct?'disabled':''}><span>${esc(o)}</span></label>`).join('')}</div>`;else if(['number','text'].includes(q.type))body=`<label for="practice-answer">${q.type==='number'?'Jawaban angka':'Jawaban singkat'}</label><input id="practice-answer" ${q.type==='number'?'inputmode="decimal"':''} maxlength="100" value="${esc(a||'')}" ${s.correct?'disabled':''} autocomplete="off" placeholder="${q.type==='number'?'Gunakan koma atau titik untuk desimal':'Ketik jawabanmu'}">`;else if(q.type==='sort'){if(!a)state.answers[q.id]=[2,0,3,1];body=state.answers[q.id].map((n,i)=>`<div class="sortrow"><b>${i+1}.</b><span>${esc(q.items[n])}</span><button data-sort="${i}" data-dir="-1" aria-label="Naikkan langkah ${i+1}" ${i===0||s.correct?'disabled':''}>↑</button><button data-sort="${i}" data-dir="1" aria-label="Turunkan langkah ${i+1}" ${i===3||s.correct?'disabled':''}>↓</button></div>`).join('')}else body=matchUI('practice');return `${head('LATIHAN INTERAKTIF','Latih pemahaman, bukan hafalan.','Pilihan ganda, pilihan kompleks, benar/salah, isian, urutan, menjodohkan, dan studi kasus.')}<div class="grid" style="grid-template-columns:minmax(0,1.65fr) minmax(220px,1fr)" id="practice-layout"><section class="card"><div class="row between"><span class="tag">LATIHAN ${practiceIndex+1} / ${PRACTICE.length}</span><span class="smalltext muted">${q.type==='multi'?'Pilih lebih dari satu jawaban':q.type==='sort'?'Urutkan langkah':q.type==='match'?'Menjodohkan':'Bab '+(q.chapter+1)}</span></div><h2 style="margin-top:22px">${esc(q.title)}</h2><p class="question">${esc(q.question)}</p>${body}<div id="practice-feedback" aria-live="polite">${s.correct?`<div class="feedback good"><b>✓ Tepat!</b><p>${esc(q.explain)}</p></div>`:s.attempts?practiceFeedback(q,s):''}</div>${q.type!=='match'?`<div class="row" style="margin-top:20px"><button class="primary" data-action="practice-check" ${s.correct?'disabled':''}>Periksa jawaban</button>${s.attempts&&!s.correct?'<button data-action="practice-retry">Coba Lagi</button>':''}<button data-action="practice-hint">💡 Petunjuk</button></div>`:''}<div class="quizfoot"><button data-practice="${practiceIndex-1}" ${practiceIndex===0?'disabled':''}>← Sebelumnya</button><button data-practice="${practiceIndex+1}" ${practiceIndex===PRACTICE.length-1?'disabled':''}>Selanjutnya →</button></div></section><aside class="stack" style="align-content:start"><div class="card"><h3>Navigasi latihan</h3><div class="qnumbers">${PRACTICE.map((p,i)=>`<button class="${i===practiceIndex?'current':''} ${state.practice[p.id]?.correct?'answered':''}" data-practice="${i}" aria-label="Latihan ${i+1}${state.practice[p.id]?.correct?', selesai':''}">${i+1}${state.practice[p.id]?.correct?' ✓':''}</button>`).join('')}</div><div class="progress"><span style="width:${PRACTICE.filter(p=>state.practice[p.id]?.correct).length/8*100}%"></span></div><p class="smalltext muted">${PRACTICE.filter(p=>state.practice[p.id]?.correct).length} dari 8 latihan dikuasai.</p></div><div class="card tint"><h3>Bantuan bertahap</h3><p class="smalltext">Jika belum tepat, coba lagi. Setelah dua percobaan, bantuan akan lebih terarah.</p><button data-chapter="${q.chapter}">Pelajari konsep terkait →</button></div>${state.done.includes('latihan')?'<div class="card"><span class="badge">🏅 Master Latihan</span><p style="margin-top:16px">Semua latihan selesai. Siap menguji pemahaman secara mandiri?</p><button class="primary" data-nav="evaluasi">Mulai evaluasi →</button></div>':''}</aside></div><style>@media(max-width:900px){#practice-layout{grid-template-columns:1fr!important}}</style>`}
function practiceFeedback(q,s){const level=clamp((s.attempts||1)-1,0,2);return `<div class="feedback bad"><b>Belum tepat. Kamu bisa mencoba lagi.</b><p>${esc(q.hints[level])}</p></div>${s.attempts>=2?`<div class="feedback"><b>Bantuan ${Math.min(s.attempts,3)} dari 3</b><p>${esc(q.hints[Math.min(s.attempts-1,2)])}</p></div>`:''}`}
function checkPractice(){const q=PRACTICE[practiceIndex],prior=state.practice[q.id]||{attempts:0};if(prior.correct)return;let a=state.answers[q.id],valid=true,correct=false;if(['single','multi','boolean'].includes(q.type)){a=$$('input[name="practice-answer"]:checked').map(e=>+e.value);valid=a.length>0;correct=JSON.stringify([...a].sort())===JSON.stringify([...q.answer].sort())}else if(q.type==='number'){a=$('#practice-answer').value.trim();const n=Number(a.replace(',','.'));valid=a!==''&&Number.isFinite(n);correct=valid&&Math.abs(n-q.answer)<1e-9}else if(q.type==='text'){a=$('#practice-answer').value.trim();valid=a!=='';correct=a.toLowerCase()===q.answer}else if(q.type==='sort')correct=JSON.stringify(a)===JSON.stringify(q.answer);if(!valid){toast(q.type==='number'?'Masukkan nilai yang sesuai.':'Silakan isi atau pilih jawaban terlebih dahulu.');return}state.answers[q.id]=a;prior.attempts++;prior.correct=correct;state.practice[q.id]=prior;if(correct){state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);award(q.id,100);if(PRACTICE.every(p=>state.practice[p.id]?.correct)){done('latihan');celebrate()}}else state.streak=0;sound(correct);save();render()}
function gamePage(){return `${head('GAME ZONE','Mainkan konsepnya.','Permainan singkat untuk mengingat, menghubungkan, dan menguji pemahaman matematika.')}<div class="tabs">${[['battle','Quiz Battle'],['match','Match It!'],['timer','Challenge Timer'],['mystery','Mystery Box']].map(([id,t])=>`<button data-game-tab="${id}" class="${gameTab===id?'active':''}">${t}</button>`).join('')}</div>${gameTab==='match'?`<section class="card" style="max-width:900px"><h2>Pasangkan bentuk dengan nilai</h2>${matchUI('game')}</section>`:gameTab==='mystery'?mysteryPage():roundGame()}<div class="card" style="margin-top:22px"><div class="row between"><div><h3 style="margin:0">Pencapaian belajarmu</h3><p class="helptext">Poin permainan dan XP tersimpan pada perangkat ini.</p></div><span class="badge">⚡ ${fmt(xp())} XP · 🔥 Rekor streak ${state.bestStreak}</span></div></div>`}
function roundGame(){const type=gameTab,timed=type==='timer';if(!game||game.type!==type)return `<section class="card empty"><span class="iconbox">${ico(timed?'time':'bolt')}</span><h2>${timed?'Lima soal. Enam puluh detik.':'Quiz Battle'}</h2><p>${timed?'Jawaban benar pada percobaan pertama bernilai 100 poin. Bonus 2 poin per detik sisa diberikan jika semua jawaban benar.':'Lima pertanyaan, satu per satu. Jawaban pertama yang benar mendapat 100 poin; setiap jawaban disertai alasan.'}</p><p class="muted">Skor terbaik: ${state.gameBest[type]||0}</p><button class="primary" data-game-start="${type}">${timed?'Mulai tantangan 60 detik':'Mulai Quiz Battle'} ${ico('arrow')}</button></section>`;if(game.finished)return `<section class="card empty"><span class="badge">RONDE SELESAI</span><h2 style="margin-top:20px">${game.correct} dari 5 jawaban benar</h2><div class="metric">${game.score} poin</div><p>${game.correct===5?'Hebat, seluruh konsep pada ronde ini terjawab tepat.':'Buka kembali materi untuk memperkuat bagian yang belum tepat.'}</p><div class="row" style="justify-content:center"><button class="primary" data-game-start="${type}">Main lagi</button><button data-nav="materi">Pelajari materi</button></div></section>`;const q=game.questions[game.index],a=game.answers[game.index];return `<section class="card" style="max-width:900px"><div class="row between"><span class="tag">SOAL ${game.index+1} / 5</span>${timed?'<span class="timer" id="game-timer">60 dtk</span>':`<span class="badge">${game.correct*100} poin</span>`}</div><div class="progress"><span style="width:${game.index/5*100}%"></span></div><p class="question">${esc(q.question)}</p><div class="options">${q.options.map((o,i)=>`<button class="option ${a?.choice===i?'selected':''}" data-game-answer="${i}" ${a?'disabled':''}><span class="letter">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>${a?`<div class="feedback ${a.correct?'good':'bad'}"><b>${a.correct?'✓ Tepat! +100 poin':'Belum tepat. Perhatikan konsep ini.'}</b><p>${esc(q.explain)}</p></div><button class="primary" data-action="game-next" style="margin-top:18px">${game.index===4?'Lihat skor':'Soal berikutnya →'}</button>`:''}</section>`}
let mystery={opened:{},active:null,attempts:{}};
function mysteryPage(){return `<div class="grid"><section class="card"><div class="row between"><h2>Pilih kotak misterimu</h2><span class="tag">${Object.keys(mystery.opened).length} / 8 dibuka</span></div><p>Enam soal, satu petunjuk, dan satu bonus. Selesaikan semua kotak untuk menuntaskan permainan.</p><div class="mysterygrid">${Array.from({length:8},(_,i)=>`<button class="mystery ${mystery.opened[i]?'done':''}" data-box="${i}" ${mystery.opened[i]?'disabled':''} aria-label="Buka kotak ${i+1}">${mystery.opened[i]?'✓':'◇'}<br><small>Kotak ${i+1}</small></button>`).join('')}</div><button data-action="mystery-reset" style="margin-top:18px">↻ Main ulang</button></section><section class="card"><div class="eyebrow">ISI KOTAK</div>${mystery.active===null?'<h3>Mulai dari kotak mana saja.</h3><p class="muted">Setiap kotak mengajakmu menggunakan konsep eksponen atau akar.</p>':mystery.active===6?'<h2>💡 Kartu petunjuk</h2><p>Ketika basis berada antara 0 dan 1, pangkat yang lebih besar menghasilkan nilai yang lebih kecil.</p><div class="formula center">(½)¹ > (½)² > (½)³</div>':mystery.active===7?'<h2>⭐ Bonus eksplorasi</h2><p>+50 XP untuk rasa ingin tahumu. Lanjutkan membuka kotak soal!</p>':mysteryQuestion()}</section></div>`}
function mysteryQuestion(){const i=mystery.active,q=GAME_QUESTIONS[i],ok=mystery.opened[i];return `<span class="tag">KOTAK ${i+1}</span><p class="question" style="margin-top:20px">${esc(q.question)}</p><div class="options">${q.options.map((o,n)=>`<button class="option" data-mystery-answer="${n}" ${ok?'disabled':''}>${esc(o)}</button>`).join('')}</div>${ok?`<div class="feedback good">✓ Tepat! ${esc(q.explain)}</div>`:mystery.attempts[i]?`<div class="feedback bad">Belum tepat. ${esc(q.explain)} Coba lagi.</div>`:''}`}
function startGame(type){game={type,questions:shuffle(GAME_QUESTIONS).slice(0,5),index:0,answers:[],correct:0,score:0,deadline:type==='timer'?Date.now()+60000:null,finished:false};render()}
function finishGame(){if(!game||game.finished)return;game.finished=true;game.score=game.correct*100+(game.type==='timer'&&game.correct===5?Math.max(0,Math.floor((game.deadline-Date.now())/1000))*2:0);state.gameBest[game.type]=Math.max(state.gameBest[game.type]||0,game.score);done('game');save();if(game.correct===5)celebrate();if(route==='game')render()}
function tickGame(){if(!game||game.finished||!game.deadline)return;const remain=Math.max(0,Math.ceil((game.deadline-Date.now())/1000));if($('#game-timer'))$('#game-timer').textContent=remain+' dtk';if(remain===0){finishGame();toast('Waktu tantangan selesai. Skor sudah dihitung.')}}
function settings(){return {passingGrade:MODULE_CONFIG.passingGrade,jumlahSoal:MODULE_CONFIG.jumlahSoal,enableTimer:MODULE_CONFIG.enableTimer,timerMinutes:MODULE_CONFIG.timerMinutes,...state.settings}}
function selectedExamBank(count){const groups=[1,2,3,4,5].map(n=>shuffle(QUESTION_BANK.filter(q=>q.chapter===n)));const result=[];while(result.length<count){for(const group of groups){if(result.length>=count)break;if(group.length)result.push(group.shift())}if(groups.every(g=>!g.length))break}return shuffle(result).map(q=>q.id)}
function startExam(){const s=settings(),count=clamp(Math.round(s.jumlahSoal)||15,10,QUESTION_BANK.length);const ids=selectedExamBank(count),orders={};ids.forEach(id=>orders[id]=shuffle([0,1,2,3]));state.exam={ids,orders,answers:{},flags:[],index:0,startedAt:Date.now(),deadline:s.enableTimer?Date.now()+s.timerMinutes*60000:null,passingGrade:s.passingGrade,name:state.name.trim()||'Siswa',finished:false};save();render()}
function evaluation(){const e=state.exam,s=settings();if(!e||e.finished)return `${head('EVALUASI AKHIR','Saatnya menguji pemahaman.','Kerjakan secara mandiri. Hasil akan menunjukkan konsep yang sudah dikuasai dan yang perlu diulang.')}<section class="card" style="max-width:900px"><div class="grid three"><div class="stat"><span class="iconbox">${ico('pen')}</span><div><b>${s.jumlahSoal}</b><small>Soal pilihan ganda</small></div></div><div class="stat"><span class="iconbox">${ico('time')}</span><div><b>${s.enableTimer?s.timerMinutes+' mnt':'Bebas'}</b><small>${s.enableTimer?'Timer aktif':'Tanpa batas waktu'}</small></div></div><div class="stat"><span class="iconbox">${ico('target')}</span><div><b>${s.passingGrade}</b><small>Nilai ketuntasan</small></div></div></div><div class="field" style="margin-top:28px"><label for="exam-name">Nama siswa</label><input id="exam-name" value="${esc(state.name)}" maxlength="70" placeholder="Tulis namamu untuk ringkasan hasil"></div><ol><li>Urutan soal dan pilihan diacak saat memulai.</li><li>Satu soal ditampilkan setiap layar. Kamu dapat kembali dan menandai soal.</li><li>Jawaban tersimpan otomatis, termasuk saat halaman dimuat ulang.</li><li>Pembahasan tersedia setelah evaluasi dikumpulkan.</li></ol>${s.enableTimer?'<p class="notice">Timer tetap berjalan jika kamu berpindah menu atau menutup halaman. Evaluasi dikumpulkan otomatis saat waktu habis.</p>':''}<div class="row"><button class="primary" data-action="exam-start">${state.result?'Mulai evaluasi baru':'Mulai evaluasi'} ${ico('arrow')}</button>${state.result?'<button data-nav="hasil">Lihat hasil sebelumnya</button>':''}</div></section>`;const q=QUESTION_BANK.find(x=>x.id===e.ids[e.index]),a=e.answers[q.id];return `${head('EVALUASI AKHIR',`Soal ${e.index+1} dari ${e.ids.length}`,'Pilih satu jawaban paling tepat. Pembahasan dibuka setelah dikumpulkan.')}<div class="grid" style="grid-template-columns:minmax(0,1.75fr) minmax(220px,1fr)" id="exam-layout"><section class="card"><div class="row between"><span class="tag">${esc(q.topic)}</span>${e.deadline?'<span id="exam-timer" class="timer" role="timer" aria-label="Sisa waktu"></span>':'<span class="smalltext muted">Tanpa timer</span>'}</div><div class="progress"><span style="width:${Object.keys(e.answers).length/e.ids.length*100}%"></span></div><p class="question" style="margin-top:25px">${esc(q.question)}</p><div class="options">${e.orders[q.id].map((n,i)=>`<button class="option ${a===n?'selected':''}" data-exam-answer="${n}" aria-pressed="${a===n}"><span class="letter">${'ABCD'[i]}</span><span>${esc(q.options[n])}</span></button>`).join('')}</div><div class="quizfoot"><button data-exam-index="${e.index-1}" ${e.index===0?'disabled':''}>← Sebelumnya</button><button data-action="exam-flag" aria-pressed="${e.flags.includes(q.id)}">${e.flags.includes(q.id)?'★ Ditandai':'☆ Tandai'}</button>${e.index<e.ids.length-1?`<button class="primary" data-exam-index="${e.index+1}">Selanjutnya →</button>`:'<button class="primary" data-action="exam-submit">Kumpulkan</button>'}</div></section><aside class="card" style="align-self:start"><h3>Navigasi soal</h3><p class="smalltext muted">${Object.keys(e.answers).length} / ${e.ids.length} dijawab · ${e.flags.length} ditandai</p><div class="qnumbers">${e.ids.map((id,i)=>`<button data-exam-index="${i}" class="${e.answers[id]!==undefined?'answered':''} ${e.index===i?'current':''} ${e.flags.includes(id)?'flagged':''}" aria-label="Soal ${i+1}${e.answers[id]!==undefined?', sudah dijawab':''}${e.flags.includes(id)?', ditandai':''}" ${e.index===i?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><p class="helptext">Nomor dengan latar berwarna sudah dijawab. ★ berarti ditandai untuk ditinjau.</p><button class="primary" style="width:100%" data-action="exam-submit">Kumpulkan evaluasi</button></aside></div><style>@media(max-width:900px){#exam-layout{grid-template-columns:1fr!important}}</style>`}
function tickExam(){const e=state.exam;if(!e||e.finished||!e.deadline)return;const sec=Math.max(0,Math.ceil((e.deadline-Date.now())/1000));const t=$('#exam-timer');if(t)t.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec===0){finishExam(true)}}
function submitExam(){const e=state.exam;if(!e||e.finished)return;const empty=e.ids.filter(id=>e.answers[id]===undefined).length;modal('Kumpulkan evaluasi?',`<p>${empty?`Masih ada <b>${empty} soal belum dijawab</b>. Soal kosong bernilai 0.`:'Semua soal sudah dijawab.'} ${e.flags.length?`Ada ${e.flags.length} soal ditandai untuk ditinjau.`:''}</p><p>Setelah dikumpulkan, jawaban pada percobaan ini tidak dapat diubah.</p><div class="row"><button data-action="close-modal">Periksa kembali</button><button class="primary" data-action="exam-finish">Kumpulkan & lihat hasil</button></div>`)}
function finishExam(timed=false){const e=state.exam;if(!e||e.finished)return;e.finished=true;const correct=e.ids.filter(id=>e.answers[id]===QUESTION_BANK.find(q=>q.id===id).answer).length,unanswered=e.ids.filter(id=>e.answers[id]===undefined).length;state.result={...JSON.parse(JSON.stringify(e)),correct,unanswered,wrong:e.ids.length-correct-unanswered,score:Math.round(correct/e.ids.length*100),finishedAt:Date.now(),timedOut:timed};done('evaluasi');award('evaluation-score-'+Math.floor(state.result.score/10),100);save();closeModal();route='hasil';state.last='hasil';save();render();window.scrollTo(0,0);if(state.result.score===100)celebrate();if(timed)toast('Waktu evaluasi selesai. Jawaban yang tersimpan telah dinilai otomatis.')}

function results(){const r=state.result;if(!r)return `${head('HASIL BELAJAR','Setiap hasil menunjukkan arah.','Selesaikan evaluasi untuk melihat skor, pembahasan, dan rekomendasi materi.')}<section class="card empty"><span class="iconbox">${ico('chart')}</span><h2>Belum ada hasil evaluasi</h2><p>Progres kegiatanmu tetap tersimpan. Kerjakan evaluasi saat kamu siap.</p><button class="primary" data-nav="evaluasi">${state.exam&&!state.exam.finished?'Lanjutkan evaluasi':'Buka evaluasi'} →</button></section>`;const mastered=[],review=[];for(let i=1;i<=5;i++){const ids=r.ids.filter(id=>QUESTION_BANK.find(q=>q.id===id).chapter===i),n=ids.filter(id=>r.answers[id]===QUESTION_BANK.find(q=>q.id===id).answer).length;if(ids.length){const record={i:i-1,correct:n,total:ids.length};(n/ids.length*100>=r.passingGrade?mastered:review).push(record)}}return `${head('HASIL BELAJAR',r.score>=r.passingGrade?'Pemahamanmu terus bertumbuh.':'Mari perkuat beberapa konsep.','Gunakan hasil ini untuk menentukan langkah belajar berikutnya.')}<div class="print-only"><p>${esc(MODULE_CONFIG.judul)} · ${esc(MODULE_CONFIG.instansi)}<br>Pengembang: ${esc(MODULE_CONFIG.namaPengembang)}</p></div><div class="grid"><section class="card"><div class="grid" style="align-items:center"><div class="ring" style="--score:${r.score}"><strong>${r.score}<small>dari 100</small></strong></div><div><span class="badge">${r.score>=r.passingGrade?'✓ TUNTAS':'↗ PERLU PENGUATAN'}</span><h2 style="margin-top:16px">${esc(r.name)}</h2><p class="muted smalltext">${new Date(r.finishedAt).toLocaleString('id-ID')}<br>Nilai minimum: ${r.passingGrade}</p></div></div><div class="grid three" style="margin-top:25px"><div><b class="metric">${r.correct}</b><div class="smalltext">Benar</div></div><div><b class="metric" style="color:var(--bad)">${r.wrong}</b><div class="smalltext">Salah</div></div><div><b class="metric" style="color:var(--muted)">${r.unanswered}</b><div class="smalltext">Kosong</div></div></div>${r.timedOut?'<p class="notice">Evaluasi dikumpulkan otomatis karena waktu habis.</p>':''}</section><section class="card"><h3>Analisis per bab</h3>${[...mastered,...review].sort((a,b)=>a.i-b.i).map(t=>`<div style="margin-top:15px"><div class="row between smalltext"><span>${t.i+1}. ${esc(MODULE_CONFIG.submateri[t.i])}</span><b>${t.correct}/${t.total}</b></div><div class="progress"><span style="width:${t.correct/t.total*100}%"></span></div></div>`).join('')}<p class="helptext">Analisis dihitung dari jawaban pada percobaan terakhir. Ketuntasan per bab menggunakan batas nilai yang sama.</p></section></div><div class="grid" style="margin-top:22px"><section class="card"><h3>✓ Sudah dikuasai</h3>${mastered.length?mastered.map(t=>`<p>${esc(MODULE_CONFIG.submateri[t.i])} <span class="tag teal">${t.correct}/${t.total}</span></p>`).join(''):'<p class="muted">Belum ada bab yang mencapai batas ketuntasan. Mulai dari bab pertama dan gunakan jalur bantuan.</p>'}<div class="row">${badges()}</div></section><section class="card"><h3>↗ Rekomendasi belajar</h3>${review.length?review.map(t=>`<div class="row between" style="margin-bottom:12px"><span>${esc(MODULE_CONFIG.submateri[t.i])}</span><button class="small" data-chapter="${t.i}">Pelajari kembali →</button></div>`).join(''):'<p>Semua bab yang diuji mencapai ketuntasan. Lanjutkan ke proyek STEM dan jelaskan alasan matematis keputusanmu.</p>'}</section></div><div class="row screen-only" style="margin-top:22px"><button class="primary" data-action="review-toggle">${showReview?'Sembunyikan':'Lihat'} Pembahasan</button><button data-action="print">🖨 Cetak Hasil</button><button data-action="export">↓ Simpan Ringkasan</button><button data-nav="refleksi">Isi refleksi →</button><button data-nav="evaluasi">Ulangi evaluasi</button></div><div id="result-review" class="${showReview?'':'hidden'}">${showReview?resultReview(r):''}</div><section class="print-only" style="margin-top:24px"><h3>Refleksi</h3><p><b>Saya memahami:</b> ${esc(state.reflection.understand||'Belum diisi')}<br><b>Masih sulit:</b> ${esc(state.reflection.difficult||'Belum diisi')}</p></section>`}

const SAMPLE_DATA='0;100\n1;150\n2;225\n3;337,5\n4;506,25\n5;759,375\n6;1139,0625\n7;1708,59375';
function parseProjectData(raw){
 const lines=raw.trim().split(/\r?\n/).filter(x=>x.trim());
 if(lines.length<8||lines.length>30)throw new Error('Gunakan 8–30 pasangan data. Dua titik terakhir dipakai untuk pengujian.');
 const data=lines.map(line=>{const pieces=line.trim().split(/[;\t]/),a=pieces.map(x=>Number(x.trim().replace(',','.')));if(a.length!==2||pieces.some(x=>!x.trim())||!a.every(Number.isFinite)||a[1]<=0||Math.abs(a[0])>1e6||a[1]>1e12)throw new Error('Tulis setiap baris sebagai waktu;nilai. Waktu harus berada antara −1.000.000 dan 1.000.000; nilai y harus positif dan paling besar 10¹².');return a});
 const gap=data[1][0]-data[0][0];if(gap<=0||data.some((p,i)=>i&&Math.abs(p[0]-data[i-1][0]-gap)>1e-6))throw new Error('Gunakan waktu yang meningkat dengan selang yang sama pada semua baris.');
 const train=data.slice(0,-2),test=data.slice(-2),first=train[0],last=train.at(-1),slope=(last[1]-first[1])/(last[0]-first[0]),factor=(last[1]/first[1])**(1/(last[0]-first[0]));
 const predictions=test.map(([x,y])=>({x,y,linear:first[1]+slope*(x-first[0]),exp:first[1]*factor**(x-first[0])}));
 if(![slope,factor,...predictions.flatMap(p=>[p.linear,p.exp])].every(Number.isFinite)||factor<=0)throw new Error('Rentang perubahan terlalu besar untuk dihitung. Gunakan skala nilai atau satuan yang lebih sesuai.');
 const linearError=predictions.reduce((s,p)=>s+Math.abs(p.linear-p.y)/p.y,0)/2*100,expError=predictions.reduce((s,p)=>s+Math.abs(p.exp-p.y)/p.y,0)/2*100;
 return {data,train,test,first,last,slope,factor,predictions,linearError,expError,gap};
}

div>';$('#project-analysis').innerHTML='<p class="muted">Perbaiki data untuk melanjutkan analisis.</p>'}}

    case 'sim-run':{if(!$('#sim-initial').checkValidity()){toast('Nilai awal harus berupa bilangan dari 1 sampai 1.000.');break}clearInterval(simRun);let i=0;updateSim(0);simRun=setInterval(()=>{i++;updateSim(i);if(i>=sim.steps){clearInterval(simRun);simRun=null}},350);break}
    case 'sim-hint':$('#sim-hint').textContent='Bandingkan N(1)/N(0) dan N(2)/N(1). Rasionya selalu b. Uji faktor 2 untuk pertumbuhan, lalu 0,5 untuk peluruhan.';break;
    case 'sim-done':if(!state.project.simNote?.trim()){toast('Tuliskan kesimpulan eksperimen terlebih dahulu.');$('#sim-note').focus();break}done('simulasi');toast('Kesimpulan eksperimen tersimpan.');break;
    case 'data-analyze':analyzeProject();break;
    case 'data-example':$('#project-data').value=SAMPLE_DATA;state.project.data=SAMPLE_DATA;state.project.dataType='ilustrasi';$('#project-data-type').value='ilustrasi';save();analyzeProject();break;
    case 'project-save':if(state.project.analyzed!==(state.project.data??SAMPLE_DATA)||!state.project.source?.trim()||!state.project.design?.trim()||!state.project.reason?.trim()){toast('Analisis data dahulu, lalu isi sumber, model, hasil uji, dan alasan keputusan kelompok.');break}done('project');toast('Lembar keputusan proyek tersimpan.');break;
    case 'practice-check':checkPractice();break;
    case 'practice-retry':$('#practice-feedback').innerHTML='<div class="feedback">Baca petunjuk, ubah jawaban, lalu tekan Periksa jawaban.</div>';$('#practice-answer')?.focus();break;
    case 'practice-hint':{const q=PRACTICE[practiceIndex],s=state.practice[q.id]||{};const i=state.level==='bantuan'?Math.max(1,(s.attempts||1)-1):(s.attempts||1)-1;$('#practice-feedback').innerHTML=`<div class="feedback"><b>💡 Petunjuk</b><p>${esc(q.hints[clamp(i,0,2)])}</p></div>`;break}
    case 'game-next':if(game&&!game.finished){if(game.index===4)finishGame();else{game.index++;render()}}break;
    case 'mystery-reset':mystery={opened:{},active:null,attempts:{}};render();break;
    case 'exam-start':state.name=$('#exam-name').value.trim();save();startExam();break;
    case 'exam-flag':{const ex=state.exam;if(!ex||ex.finished)break;const id=ex.ids[ex.index];ex.flags=ex.flags.includes(id)?ex.flags.filter(i=>i!==id):[...ex.flags,id];save();render();break}
    case 'exam-submit':submitExam();break;
    case 'exam-finish':finishExam();break;
    case 'review-toggle':showReview=!showReview;render();if(showReview)$('#result-review').scrollIntoView({behavior:'smooth',block:'start'});break;
    case 'print':if(!state.result){toast('Selesaikan evaluasi sebelum mencetak hasil.');break}navigate('hasil');window.print();break;
    case 'export':exportSummary();break;
    case 'reflect-save':if(['understand','difficult','three','two','one'].some(k=>!state.reflection[k]?.trim())||state.mood===''){toast('Lengkapi refleksi, exit ticket, dan pilih perasaanmu.');break}done('refleksi');toast('Refleksi belajar tersimpan.');if(percent()===100){celebrate();navigate('selesai')}break;
    case 'teacher':askTeacher();break;
    case 'teacher-lock':teacher=false;navigate('home');toast('Mode Guru dikunci.');break;
    case 'teacher-save':{if(!teacher)break;const count=Number($('#teacher-count').value),pass=Number($('#teacher-pass').value),minutes=Number($('#teacher-minutes').value);if(![count,pass,minutes].every(Number.isInteger)||count<10||count>15||pass<0||pass>100||minutes<1||minutes>180||['teacher-count','teacher-pass','teacher-minutes'].some(id=>!$('#'+id).value.trim())){toast('Periksa jumlah soal, nilai minimum, dan durasi sesuai batas yang tertera.');break}state.settings={jumlahSoal:count,passingGrade:pass,timerMinutes:minutes,enableTimer:$('#teacher-timer').checked};save();toast('Pengaturan tersimpan untuk evaluasi baru.');break}
    case 'sidebar-toggle':document.body.classList.toggle('hide-side');break;
    case 'student-pick':{if(!teacher)break;const names=[...new Set(state.roster.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];if(!names.length){toast('Masukkan sedikitnya satu nama siswa.');$('#student-roster').focus();break}const n=names[Math.floor(Math.random()*names.length)];$('#picked-student').textContent='Memilih…';setTimeout(()=>{if($('#picked-student'))$('#picked-student').textContent=n},350);break}
    case 'teams-reset':if(teacher)confirmAction('Reset skor tim?','Skor keempat tim akan kembali menjadi nol. Nama tim tetap disimpan.','teams-reset-confirm','Reset skor');break;
    case 'teams-reset-confirm':if(teacher){state.teams=[0,0,0,0];save();closeModal();render()}break;
    case 'reset-request':if(teacher)confirmAction('Reset Data Siswa?','Nama, progres, jawaban, hasil, XP, refleksi, dan proyek pada modul ini akan dihapus dari browser. Simpan ringkasan sebelum melanjutkan.','reset-confirm','Hapus data siswa');break;
    case 'reset-confirm':if(teacher){const {theme,settings,teams,teamNames,roster}=state;state={...baseState(),theme,settings,teams,teamNames,roster,started:true,seenHelp:true};game=null;mystery={opened:{},active:null,attempts:{}};matchState={};selectedMatch=null;teacher=false;closeModal();save();navigate('home');toast('Data siswa dihapus. Pengaturan kelas dipertahankan.')}break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='cover-range'){const n=+t.value;$('#cover-n').textContent=n;$('#cover-eq').innerHTML='2<sup>'+n+'</sup> = '+2**n;$('#cover-chart').innerHTML=curveSVG(1,2,6,n,true)}
  else if(id==='student-name'||id==='exam-name'){state.name=t.value;save();$$('.profile').forEach(x=>x.textContent=state.name||'Siswa')}
  else if(id==='warm-observation'){state.intro.note=t.value;save()}
  else if(id==='fold-range'){const n=+t.value,v=2**n;$('#fold-n').textContent=n;$('#fold-equation').innerHTML='2<sup>'+n+'</sup> = '+v+' lapisan';$('#fold-visual').innerHTML='<span></span>'.repeat(v);$('#fold-description').textContent=v+' lapisan setelah '+n+' lipatan.';$('#fold-chart').innerHTML=curveSVG(1,2,6,n)}
  else if(id==='area-range'){const a=+t.value,s=Math.sqrt(a),side=s*22;$('#area-value').textContent=a;$('#area-equation').textContent='s = √'+a+' ≈ '+fmt(s)+' m';const r=$('#area-square');r.setAttribute('width',side);r.setAttribute('height',side);r.setAttribute('x',180-side/2);r.setAttribute('y',150-side/2);$('#area-label').textContent=a+' m²';$('#side-label').textContent='Sisi ≈ '+fmt(s)+' m'}
  else if(['sim-rate','sim-steps','sim-initial'].includes(id)){clearInterval(simRun);simRun=null;const n=Number(t.value);if(id==='sim-initial'){if(!t.value||!t.checkValidity())return;sim.initial=n}else if(id==='sim-rate')sim.rate=n;else sim.steps=n;updateSim()}
  else if(id==='coral-half'||id==='coral-depth'){const h=+$('#coral-half').value,d=+$('#coral-depth').value,intensity=100*.5**(d/h),ok=d>=4&&intensity>=12.5;$('#coral-half-label').textContent=h;$('#coral-depth-label').textContent=fmt(d);$('#coral-intensity').textContent=fmt(intensity)+'%';$('#coral-status').className='feedback '+(ok?'good':'bad');$('#coral-status').textContent=(ok?'✓ Memenuhi kedua syarat.':'✕ Belum memenuhi: ')+(ok?'':d<4?'kedalaman kurang dari 4 m.':'cahaya kurang dari 12,5%.');$('#coral-zone').textContent=3*h>=4?'4 ≤ d ≤ '+3*h+' m':'Tidak ada zona yang memenuhi kedua syarat';$('#coral-chart').innerHTML=curveSVG(100,.5,6,Math.round(d/h))}
  else if(id==='algae-time'){const n=+t.value,a=2**n,b=64*2**(n/3);$('#algae-day').textContent=n;$('#algae-a').textContent=fmt(a);$('#algae-b').textContent=fmt(b);$('#algae-status').textContent=n===9?'✓ Kedua kolam sama: 512 juta sel/mL.':a>b?'Kolam A lebih padat.':'Kolam B lebih padat.';$('#algae-status').className='feedback '+(n===9?'good':'')}
  else if(id==='tank-height'){const h=+t.value,s=Math.sqrt(4/h),ok=h<=1.2&&s<=2;$('#tank-h').textContent=fmt(h);$('#tank-side').textContent='Sisi minimum ≈ '+fmt(s)+' m';$('#tank-status').className='feedback '+(ok?'good':'bad');$('#tank-status').textContent=ok?'✓ Memenuhi batas tinggi dan lahan.':h>1.2?'✕ Tinggi melebihi batas 1,2 m.':'✕ Sisi minimum melebihi batas lahan 2 m.'}
  else if(id==='sim-note'){state.project.simNote=t.value;save()}
  else if(id.startsWith('project-')){state.project[{'project-team':'team','project-design':'design','project-reason':'reason','project-data':'data','project-source':'source','project-data-type':'dataType'}[id]]=t.value;save()}
  else if(id==='practice-answer'){state.answers[PRACTICE[practiceIndex].id]=t.value;save()}
  else if(t.name==='practice-answer'){state.answers[PRACTICE[practiceIndex].id]=$$('input[name="practice-answer"]:checked').map(x=>+x.value);$$('label.option').forEach(x=>x.classList.toggle('selected',$('input',x).checked));save()}
  else if(id.startsWith('reflect-')){state.reflection[id.slice(8)]=t.value;save()}
  else if(id==='student-roster'&&teacher){state.roster=t.value;save()}
  else if(t.dataset.teamName!==undefined&&teacher){state.teamNames[+t.dataset.teamName]=t.value;save()}
});
document.addEventListener('change',e=>{if(e.target.id==='learning-level'){state.level=e.target.value;save();render();toast('Jalur belajar diperbarui.')}if(e.target.id==='sim-mode'){clearInterval(simRun);simRun=null;sim.mode=e.target.value;sim.rate=sim.mode==='growth'?2:.5;$('#sim-body').innerHTML=modelSim();updateSim()}});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&ifp){ifp=false;render()}});
window.addEventListener('beforeunload',e=>{save();if(state.exam&&!state.exam.finished){e.preventDefault();e.returnValue='Evaluasi belum selesai.'}});
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickExam();tickGame()}});
/* Validasi sesi tersimpan agar perubahan konfigurasi/bank tidak merusak navigasi. */
if(state.exam){const e=state.exam;const valid=Array.isArray(e.ids)&&e.ids.length>0&&e.ids.every(id=>QUESTION_BANK.some(q=>q.id===id))&&e.orders&&e.answers&&Array.isArray(e.flags)&&e.ids.every(id=>Array.isArray(e.orders[id])&&e.orders[id].length===4);if(!valid)state.exam=null;else e.index=clamp(Number(e.index)||0,0,e.ids.length-1)}
if(state.result&&(!Array.isArray(state.result.ids)||!state.result.ids.every(id=>QUESTION_BANK.some(q=>q.id===id))))state.result=null;
document.title=MODULE_CONFIG.judul+' — '+MODULE_CONFIG.namaPengembang;
render();
setInterval(()=>{tickExam();tickGame()},500);
/* WebMCP bersifat opsional; browser tanpa dukungan tetap menjalankan semua fitur. */
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_learning_progress',title:'Baca progres belajar',description:'Membaca progres kegiatan dan nilai evaluasi terakhir pada perangkat ini.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length)throw new Error('Input harus berupa objek kosong.');return {progress:percent(),completed:[...state.done],score:state.result?.score??null}}})).catch(()=>{})}catch{}}
if(MODULE_CONFIG.enablePWA&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){const link=document.createElement('link');link.rel='manifest';link.href='./manifest.webmanifest';document.head.append(link);window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
